name: Research dry-run

on:
  workflow_dispatch:
    inputs:
      research_dry_run:
        description: "Safe research switch. Never sends email and never writes the signal ledger."
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install chart font
        run: sudo apt-get update && sudo apt-get install -y fonts-wqy-microhei

      - name: Run verifier and research tests
        run: python -m pytest -q

      - name: Research dry-run
        if: ${{ inputs.research_dry_run != false }}
        run: python -m research.run --dry-run

      - name: Research full run
        if: ${{ inputs.research_dry_run == false }}
        run: python -m research.run --full

      - name: Upload research outputs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: signal-research-report
          path: |
            output/research/report.html
            output/research/signals.csv
            output/research/groups.csv
            output/research/simulations.csv
            output/research/coverage.csv
            output/research/conclusions.csv
          if-no-files-found: warn
