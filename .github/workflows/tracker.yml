name: US Stock Signal Tracker

on:
  workflow_dispatch:
    inputs:
      test_email:
        description: "Send tracker email connectivity test only"
        required: false
        type: boolean
        default: false
  schedule:
    # Runs after both source radars: strength at 22:00 UTC, DXDX at 22:30 UTC.
    - cron: "30 23 * * 1-5"

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run verifier tests
        run: python -m pytest -q

      - name: Test tracker email connectivity
        if: ${{ inputs.test_email == true }}
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python tracker.py --test-email

      - name: Update formal signal history
        if: ${{ inputs.test_email != true }}
        env:
          # Optional. The client automatically retries public cross-repo reads anonymously
          # if this repository-scoped token is rejected by a source repository.
          GH_TOKEN: ${{ github.token }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python tracker.py

      - name: Show tracker report
        if: ${{ always() && inputs.test_email != true }}
        run: cat output/tracker_report.txt || true

      - name: Commit tracker history
        if: ${{ inputs.test_email != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ output/
          if git diff --cached --quiet; then
            echo "No tracker changes to commit."
          else
          git commit -m "Update signal history"
            git push
          fi

      - name: Upload tracker report artifact
        id: artifact_upload_first
        if: ${{ always() && inputs.test_email != true }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: stock-signal-tracker-report
          path: |
            output/tracker_report.csv
            output/tracker_report.txt
          if-no-files-found: warn

      - name: Retry tracker report artifact upload
        id: artifact_upload_retry
        if: ${{ always() && inputs.test_email != true && steps.artifact_upload_first.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          # V4 artifacts are immutable within a run.  A distinct retry name
          # avoids a same-name conflict if the first network attempt partly created one.
          name: stock-signal-tracker-report-retry
          path: |
            output/tracker_report.csv
            output/tracker_report.txt
          if-no-files-found: warn

      - name: Warn when both artifact uploads fail
        if: ${{ always() && inputs.test_email != true && steps.artifact_upload_first.outcome == 'failure' && steps.artifact_upload_retry.outcome == 'failure' }}
        run: echo "::warning::Artifact upload failed after retry; tracker data and report were already committed to repository."
