name: US Stock Signal Tracker

on:
  workflow_dispatch:
  schedule:
    # Runs after both source radars: strength at 22:00 UTC, DXDX at 22:30 UTC.
    - cron: "30 23 * * 1-5"

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run verifier tests
        run: python -m pytest -q

      - name: Update formal signal history
        env:
          # Optional. The client automatically retries public cross-repo reads anonymously
          # if this repository-scoped token is rejected by a source repository.
          GH_TOKEN: ${{ github.token }}
        run: python tracker.py

      - name: Show tracker report
        if: always()
        run: cat output/tracker_report.txt || true

      - name: Commit tracker history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ output/
          if git diff --cached --quiet; then
            echo "No tracker changes to commit."
          else
          git commit -m "Update signal history"
            git push
          fi

      - name: Upload scorecard artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-signal-tracker-report
          path: |
            output/tracker_report.csv
            output/tracker_report.txt
          if-no-files-found: warn
